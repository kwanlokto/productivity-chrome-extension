<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="popup.css" />
  <title>Focus Guard</title>
</head>
<body>
  <header>
    <span class="logo">🌱</span>
    <h1>Focus Guard</h1>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="sites" role="tab">Blocked sites</button>
    <button class="tab" data-tab="youtube" role="tab">YouTube</button>
  </nav>

  <div class="panel is-active" data-panel="sites">

    <!-- Main view: current-tab action circle + entry to the list editor -->
    <div id="sites-main">
      <section id="status-section">
        <!-- One big circular control whose label + action depend on state -->
        <div id="action-circle-wrap" class="hidden">
          <button id="action-circle" type="button">
            <svg class="ring" viewBox="0 0 120 120">
              <circle class="ring-track" cx="60" cy="60" r="54"></circle>
              <circle class="ring-progress hidden" cx="60" cy="60" r="54"></circle>
            </svg>
            <span class="circle-text">
              <span class="circle-main" id="circle-main"></span>
              <span class="circle-sub" id="circle-sub"></span>
            </span>
          </button>
        </div>
      </section>
      <button id="open-manage" class="wide-btn">Change blocked sites</button>
    </div>

    <!-- Manage view: add/remove blocked sites -->
    <div id="sites-manage" class="hidden">
      <button id="back-to-main" class="back-link">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="M11 18l-6-6 6-6" />
        </svg>
        Back
      </button>
      <section>
        <h2>Blocked sites</h2>
        <form id="add-form">
          <input id="domain-input" type="text" placeholder="add a domain, e.g. reddit.com" autocomplete="off" />
          <button type="submit">Add</button>
        </form>
        <ul id="domain-list"></ul>
        <p id="empty" class="empty hidden">No sites blocked yet.</p>
      </section>
    </div>

  </div>

  <div class="panel" data-panel="youtube">

    <!-- Main view: focus toggles + entry to the channel editor -->
    <div id="youtube-main">
      <section>
        <h2>YouTube focus</h2>
        <label class="toggle">
          <input type="checkbox" data-yt="enabled" />
          <span>Enable YouTube tweaks</span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-yt="hideHomeFeed" />
          <span>Hide Home Feed</span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-yt="hideShorts" />
          <span>Hide Shorts</span>
        </label>
        <label class="toggle">
          <input type="checkbox" data-yt="hideWatchDistractions" />
          <span>Hide Watch Distractions</span>
        </label>
      </section>
      <button id="open-channels" class="wide-btn">Change allowed channels</button>
    </div>

    <!-- Manage view: add/remove allowed channels -->
    <div id="youtube-manage" class="hidden">
      <button id="back-to-youtube" class="back-link">
        <svg class="back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" />
          <path d="M11 18l-6-6 6-6" />
        </svg>
        Back
      </button>
      <section id="channels-section">
        <div class="section-head">
          <h2>Allowed channels</h2>
          <label class="toggle">
            <input type="checkbox" data-yt="allowedChannelsOnly" />
            <span>Enable</span>
          </label>
        </div>
        <div id="channels-editor">
          <form id="channel-form">
            <input id="channel-input" type="text" placeholder="add a channel, e.g. @veritasium" autocomplete="off" />
            <button type="submit">Add</button>
          </form>
          <ul id="channel-list"></ul>
          <p id="channel-empty" class="empty hidden">No channels allowed yet — everything will be hidden.</p>
        </div>
      </section>
    </div>

  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
