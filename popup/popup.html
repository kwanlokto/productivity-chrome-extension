<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="light dark" />
  <link rel="stylesheet" href="popup.css" />
  <title>Focus Guard</title>
</head>
<body>
  <header class="app-header">
    <img class="logo" src="sprout.png" alt="" />
    <h1>Focus Guard</h1>
    <!-- Turns the whole extension (all site blocking + YouTube tweaks) off for
         the "Break length" set on the Settings tab. -->
    <input type="checkbox" role="switch" id="power-switch" class="switch" />
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Focus Guard sections">
    <button class="tab is-active" id="tab-sites" data-tab="sites" role="tab" aria-selected="true" aria-controls="panel-sites" tabindex="0">Sites</button>
    <button class="tab" id="tab-youtube" data-tab="youtube" role="tab" aria-selected="false" aria-controls="panel-youtube" tabindex="-1">YouTube</button>
    <button class="tab" id="tab-settings" data-tab="settings" role="tab" aria-selected="false" aria-controls="panel-settings" tabindex="-1">Settings</button>
  </nav>

  <div class="panel is-active" id="panel-sites" data-panel="sites" role="tabpanel" aria-labelledby="tab-sites">

    <!-- Main view: the current tab, the big circle, and the way into the list. -->
    <div id="sites-main" class="view">
      <p class="site-line">
        <span class="site-icon" id="site-icon" aria-hidden="true"></span>
        <svg class="page-icon hidden" id="page-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2" />
          <path d="M3 9h18" />
        </svg>
        <span class="site-name" id="site-name"></span>
        <span class="chip hidden" id="site-status"></span>
      </p>

      <!-- The circle is centered in this area. States with buttons under it
           (Unlock, the countdown, Off) fill the area exactly; the others leave
           even space above and below the circle. -->
      <div class="circle-area">
        <button id="action-circle" type="button" class="circle">
          <svg class="ring" viewBox="0 0 156 156" aria-hidden="true">
            <circle class="ring-track" cx="78" cy="78" r="73" />
            <circle class="ring-progress hidden" cx="78" cy="78" r="73" transform="rotate(-90 78 78)" />
            <circle class="ring-disc" cx="78" cy="78" r="62" />
          </svg>
          <span class="circle-text">
            <span class="circle-main" id="circle-main"></span>
            <span class="circle-sub" id="circle-sub"></span>
          </span>
        </button>
        <div class="pill-row hidden" id="pill-row">
          <button id="action-circle-2x" type="button" class="pill is-danger hidden">
            <span class="pill-main">2×</span>
            <span class="pill-sub" id="circle-2x-sub"></span>
          </button>
          <button id="action-circle-3x" type="button" class="pill is-danger hidden">
            <span class="pill-main">3×</span>
            <span class="pill-sub" id="circle-3x-sub"></span>
          </button>
          <button id="add-minute-btn" type="button" class="pill is-warn hidden">+1 min</button>
          <button id="block-now-btn" type="button" class="pill is-accent hidden">Block now</button>
          <button id="turn-on-btn" type="button" class="pill is-solid hidden">Turn on now</button>
        </div>
      </div>

      <button id="open-manage" type="button" class="nav-row">
        <span>Blocked sites</span>
        <span class="nav-row-value" id="blocked-count"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </button>
    </div>

    <!-- Manage view: add/remove blocked sites -->
    <div id="sites-manage" class="view list-view hidden">
      <div class="view-head">
        <button id="back-to-main" type="button" class="back-btn" aria-label="Back" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <h2>Blocked sites</h2>
      </div>
      <form id="add-form" class="add-form">
        <input id="domain-input" class="text-input" type="text" placeholder="Add a site, e.g. reddit.com" aria-label="Site to block" autocomplete="off" />
        <button type="submit" class="btn-primary">Add</button>
      </form>
      <div class="list-box">
        <ul id="domain-list" class="item-list"></ul>
        <p id="empty" class="empty hidden">No sites blocked yet.</p>
      </div>
    </div>

  </div>

  <div class="panel" id="panel-youtube" data-panel="youtube" role="tabpanel" aria-labelledby="tab-youtube">

    <!-- Main view: focus switches and the way into the channel list. -->
    <div id="youtube-main" class="view">
      <div class="card">
        <label class="row row-tall">
          <span class="row-text">
            <span class="row-title">YouTube focus</span>
            <span class="row-hint" id="youtube-hint">Hides everything switched off below</span>
          </span>
          <input type="checkbox" role="switch" class="switch" data-yt="enabled" aria-label="YouTube focus" aria-describedby="youtube-hint" />
        </label>
        <label class="row">
          <span>Home feed</span>
          <input type="checkbox" role="switch" class="switch" data-yt="showHomeFeed" />
        </label>
        <label class="row">
          <span>Shorts</span>
          <input type="checkbox" role="switch" class="switch" data-yt="showShorts" />
        </label>
        <label class="row">
          <span>Recommendations</span>
          <input type="checkbox" role="switch" class="switch" data-yt="showRecommendations" />
        </label>
        <label class="row">
          <span>Comments</span>
          <input type="checkbox" role="switch" class="switch" data-yt="showComments" />
        </label>
      </div>
      <button id="open-channels" type="button" class="nav-row">
        <span>Allowed channels</span>
        <span class="nav-row-value" id="channels-summary"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </button>
    </div>

    <!-- Manage view: the allow-list switch and the channel list. The list stays
         editable while the switch is off, so it can be set up first. -->
    <div id="youtube-manage" class="view list-view hidden">
      <div class="view-head">
        <button id="back-to-youtube" type="button" class="back-btn" aria-label="Back" title="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
        </button>
        <h2>Allowed channels</h2>
      </div>
      <label class="card row row-tall">
        <span class="row-text">
          <span class="row-title">Only allowed channels</span>
          <span class="row-hint" id="allowlist-hint"></span>
        </span>
        <input type="checkbox" role="switch" class="switch" data-yt="allowedChannelsOnly" aria-label="Only allowed channels" aria-describedby="allowlist-hint" />
      </label>
      <form id="channel-form" class="add-form">
        <input id="channel-input" class="text-input" type="text" placeholder="Add a channel, e.g. @veritasium" aria-label="Channel to allow" autocomplete="off" />
        <button type="submit" class="btn-primary">Add</button>
      </form>
      <div class="list-box">
        <ul id="channel-list" class="item-list"></ul>
        <p id="channel-empty" class="empty hidden">No channels allowed yet.</p>
      </div>
    </div>

  </div>

  <div class="panel" id="panel-settings" data-panel="settings" role="tabpanel" aria-labelledby="tab-settings">
    <div class="view">

      <section>
        <h2 class="section-title">Durations</h2>
        <div class="card">
          <div class="row">
            <label for="unlock-input">Unlock length</label>
            <div class="stepper">
              <button type="button" class="step-btn" id="unlock-less" aria-label="Shorter unlock">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
              </button>
              <input id="unlock-input" class="stepper-input" type="number" min="1" max="1440" step="1" inputmode="numeric" aria-label="Unlock length in minutes" />
              <span class="stepper-unit" aria-hidden="true">min</span>
              <button type="button" class="step-btn" id="unlock-more" aria-label="Longer unlock">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
            </div>
          </div>
          <div class="row">
            <label for="pause-input">Break length</label>
            <div class="stepper">
              <button type="button" class="step-btn" id="pause-less" aria-label="Shorter break">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14" /></svg>
              </button>
              <input id="pause-input" class="stepper-input" type="number" min="1" max="1440" step="1" inputmode="numeric" aria-label="Break length in minutes" />
              <span class="stepper-unit" aria-hidden="true">min</span>
              <button type="button" class="step-btn" id="pause-more" aria-label="Longer break">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 class="section-title">Backup</h2>
        <div class="card">
          <button id="export-btn" type="button" class="row action-row">
            <span>Export settings</span>
          </button>
          <button id="import-btn" type="button" class="row action-row">
            <span>Import settings</span>
          </button>
        </div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
      </section>

      <button id="reset-btn" type="button" class="nav-row danger-row">
        <span id="reset-label">Reset to defaults</span>
      </button>

      <p id="settings-status" class="toast" role="status" aria-live="polite"></p>

    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
