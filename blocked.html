<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Blocked — Focus Guard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* The same colours as the popup (popup/popup.css): light by default, dark
       whenever Chrome / the OS is in dark mode. */
    :root {
      color-scheme: light dark;
      --bg: #f4f6fa;
      --surface: #ffffff;
      --line: #dde3ec;
      --line-soft: #e6eaf0;
      --text: #111827;
      --muted: #5b6577;
      --quote: #374151;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --danger-text: #b91c1c;
      --danger-soft: #fee2e2;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1422;
        --surface: #171e2e;
        --line: #263045;
        --line-soft: #263045;
        --text: #e6e9ef;
        --muted: #8e99ad;
        --quote: #c5cddb;
        --accent: #5558e3;
        --accent-hover: #4b4ed0;
        --danger-text: #f87171;
        --danger-soft: rgba(239, 68, 68, 0.14);
      }
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, sans-serif;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 36px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--surface);
    }
    .logo { width: 48px; height: 48px; }
    h1 {
      margin-top: 16px;
      font-size: 26px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .domain {
      margin-top: 12px;
      max-width: 100%;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--danger-soft);
      color: var(--danger-text);
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }
    .message {
      margin-top: 20px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.6;
    }
    .quote {
      width: 100%;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--line-soft);
    }
    .quote blockquote {
      color: var(--quote);
      font-size: 15px;
      line-height: 1.6;
      font-style: italic;
    }
    .quote figcaption { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .back {
      margin-top: 28px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 22px;
      border: 0;
      border-radius: 10px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .back:hover { background: var(--accent-hover); }
    .back:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .back svg { width: 18px; height: 18px; flex-shrink: 0; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="popup/sprout.png" alt="" />
    <h1>Stay focused</h1>
    <p class="domain" id="domain">this site</p>
    <p class="message">Focus Guard is blocking this site to protect your attention. Get back to what matters.</p>
    <figure class="quote">
      <blockquote id="quote-text"></blockquote>
      <figcaption id="quote-author"></figcaption>
    </figure>
    <button type="button" class="back" id="back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5" />
        <path d="M11 18l-6-6 6-6" />
      </svg>
      Go back
    </button>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
